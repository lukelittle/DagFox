[project]
name = "dagfox"
version = "0.1.0"
description = "DataOps agents for Apache Airflow: diagnose data problems, propose fixes, require human sign-off."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
    "pydantic-ai-slim[anthropic,bedrock,openai]>=2.60",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["dagfox*"]

[tool.setuptools.package-data]
dagfox = ["**/*.sql", "**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
